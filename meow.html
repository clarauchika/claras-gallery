<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-image: url("powderp.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      /* Stacks everything vertically in the center */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;

      /* Smooth fade transition */
      transition: opacity 0.8s ease;
    }

    body.fade-out {
      opacity: 0;
    }

    .top-text {
      text-align: center;
      color: #CCA1B0;
      font-style: italic;
      font-family: Impact, "Arial Black", sans-serif;
      font-weight: normal;
      letter-spacing: 7px;
      max-width: 800px;
      margin-bottom: 20px;
    }

    .second-text {
      text-align: center;
      color: #CCA1B0;
      font-style: italic;
      font-family: Impact, "Arial Black", sans-serif;
      font-weight: normal;
      letter-spacing: 4px;
      max-width: 1000px;
      margin-bottom: 70px;
    }

    .gallery-image {
      width: 200px;
      height: auto;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1 class="top-text">hii im lily and im a small artist who often draws my own oc clara uchika and she is the one i'll introduce you to here in her gallery! enjoy ^ . . ^</h1>

  <p class="second-text">(press chibimaru to continue)</p>

  <img src="chibimarup.jpg" class="gallery-image" id="chibimaru-btn">

  <script>
    const chibimaru = document.getElementById("chibimaru-btn");

    chibimaru.addEventListener("click", () => {
      document.body.classList.add("fade-out");

      setTimeout(() => {
        window.location.href = "christmas.html";
      }, 800);
    });
  </script>

</body>
</html>
