<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      transition: opacity 0.8s ease;
    }

    body.fade-out {
      opacity: 0;
    }

    .top-text {
      text-align: center;
      color: #E3C8D1;
      font-style: italic;
      font-family: Impact, "Arial Black", sans-serif;
      font-weight: normal;
      letter-spacing: 2px;
    }

    .container {
      position: relative;
      width: 100%;
      height: 50vh;
    }

    .background {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .top-image {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1 class="top-text">enter the gallery...</h1>

  <div class="container">
    <img src="whitep.jpg" class="background">
    <img src="sleepyintro.gif" class="top-image" id="clickable-gif">
  </div>

  <script>
    const gif = document.getElementById("clickable-gif");

    gif.addEventListener("click", () => {
      // 1. Change the gif to awake.jpeg
      gif.src = "awakep.jpg";

      // 2. Start fading out after a brief pause so you see awake.jpeg
      setTimeout(() => {
        document.body.classList.add("fade-out");
      }, 300);

      // 3. Redirect to your next page once the fade finishes
      setTimeout(() => {
        window.location.href = "meow.html";
      }, 1100);
    });
  </script>

</body>
</html>
